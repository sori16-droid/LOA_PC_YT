<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<!-- FRAGMENT_START -->
<title>채널 지표 리더보드</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f6f7f9; --surface:#fff; --line:#e1e5ec; --line-soft:#eef1f5;
  --ink:#14161a; --ink-2:#4b5260; --ink-3:#848c9a;
  --accent:#d8402a; --accent-soft:#fceee9;
  --good:#127a55; --good-soft:#e6f4ee; --warn:#a85c06; --pill:#eef1f5;
  --c1:#d8402a; --c2:#1b6fc4; --c3:#12896a; --c4:#a5721a; --c5:#6d4de0; --c6:#c02b73;
  --heat:24,111,196;
  --sans:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI","Pretendard",
    "Noto Sans KR","Malgun Gothic",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101216; --surface:#181b21; --line:#2b2f38; --line-soft:#21242b;
    --ink:#eceef2; --ink-2:#a8afbb; --ink-3:#737b88;
    --accent:#ff6f52; --accent-soft:#2e1a15;
    --good:#43c093; --good-soft:#12291f; --warn:#e0a35a; --pill:#242832;
    --c1:#ff6f52; --c2:#5aa9ff; --c3:#3cc49a; --c4:#d8a445; --c5:#a78bfa; --c6:#f172ac;
    --heat:90,169,255;
  }
}
:root[data-theme="dark"]{
  --bg:#101216; --surface:#181b21; --line:#2b2f38; --line-soft:#21242b;
  --ink:#eceef2; --ink-2:#a8afbb; --ink-3:#737b88;
  --accent:#ff6f52; --accent-soft:#2e1a15;
  --good:#43c093; --good-soft:#12291f; --warn:#e0a35a; --pill:#242832;
  --c1:#ff6f52; --c2:#5aa9ff; --c3:#3cc49a; --c4:#d8a445; --c5:#a78bfa; --c6:#f172ac;
  --heat:90,169,255;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--sans);-webkit-font-smoothing:antialiased;}
.wrap{max-width:1160px;margin:0 auto;padding:16px;padding-block:32px}
h1{font-size:26px;letter-spacing:-.02em;margin:0 0 4px}
h2{font-size:15px;letter-spacing:-.01em;margin:0;font-weight:650}
.sub{color:var(--ink-3);font-size:13px;margin:0}
.demo{display:inline-block;margin-top:12px;padding:8px 12px;border-radius:8px;
  background:var(--accent-soft);color:var(--accent);font-size:12.5px;font-weight:600}

/* 데이터 신선도 — 수집이 멈추면 바로 눈에 띄어야 합니다 */
.fresh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;
  padding:9px 13px;border-radius:10px;font-size:12.5px;
  background:var(--surface);border:1px solid var(--line)}
.fresh .dot{width:8px;height:8px;border-radius:99px;flex:none;background:var(--good)}
.fresh b{font-variant-numeric:tabular-nums}
.fresh .why{color:var(--ink-3)}
.fresh.warn{background:var(--accent-soft);border-color:var(--accent)}
.fresh.warn .dot{background:var(--accent)}
.fresh.warn .why{color:var(--accent)}
.fresh .reload{margin-left:auto;border:1px solid var(--line);background:var(--bg);
  color:var(--ink-2);font:inherit;font-size:12px;padding:4px 11px;border-radius:99px;cursor:pointer}
.fresh .reload:hover{color:var(--ink);border-color:var(--ink-3)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:22px 0 18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .k{font-size:11.5px;color:var(--ink-3);letter-spacing:.02em;margin-bottom:6px}
.kpi .v{font-size:23px;font-weight:660;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;margin-top:4px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.kpi .d .up{color:var(--good)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:18px;margin-bottom:18px}
.card-head{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;
  justify-content:space-between;margin-bottom:4px}
.hint{color:var(--ink-3);font-size:12.5px;margin:2px 0 14px;line-height:1.55}
.hint b{color:var(--ink-2)}

.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:transparent;color:var(--ink-2);
  font:inherit;font-size:12.5px;padding:5px 11px;border-radius:99px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

/* ── 지금 봐야 할 것 ── */
.alerts{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:10px;margin-bottom:18px}
.alert{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;border-left:3px solid var(--tone,var(--accent))}
.alert .eyebrow{font-size:11px;letter-spacing:.04em;color:var(--tone,var(--accent));
  font-weight:700;margin-bottom:7px;text-transform:uppercase}
.alert .nm{font-size:13.5px;font-weight:600;line-height:1.4;margin-bottom:8px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.alert .nm a{color:inherit;text-decoration:none}
.alert .nm a:hover{text-decoration:underline}
.alert .fig{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;line-height:1.55}
.alert .fig b{font-family:var(--mono);font-size:13px;color:var(--ink)}
.empty{color:var(--ink-3);font-size:12.5px;line-height:1.6;background:var(--surface);
  border:1px dashed var(--line);border-radius:12px;padding:14px 16px}

.chart{width:100%;overflow-x:auto}
svg{display:block;max-width:100%}
.gl{stroke:var(--line-soft)}
.ax{fill:var(--ink-3);font-size:10.5px;font-family:var(--mono)}
.dot-hit{cursor:pointer}

/* ── 히트맵 ── */
.hm{display:grid;grid-template-columns:34px repeat(8,1fr);gap:3px;min-width:460px}
.hm .hd{font-size:10.5px;color:var(--ink-3);font-family:var(--mono);
  display:flex;align-items:center;justify-content:center;padding-bottom:2px}
.hm .rw{font-size:11.5px;color:var(--ink-2);display:flex;align-items:center;justify-content:flex-end;
  padding-right:6px}
.hm .cl{aspect-ratio:1.9;border-radius:5px;background:var(--line-soft);
  display:flex;align-items:center;justify-content:center;font-size:10.5px;
  font-family:var(--mono);color:var(--ink-3);cursor:default}
.hm .cl.on{color:#fff;font-weight:500}
.hm-wrap{overflow-x:auto}

.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
input[type="search"]{font:inherit;font-size:13px;padding:6px 11px;border-radius:99px;
  border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:170px}
input[type="search"]::placeholder{color:var(--ink-3)}
input[type="date"]{font:inherit;font-size:12.5px;font-family:var(--mono);padding:5px 9px;
  border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);
  color-scheme:light dark}
.rng{display:flex;align-items:center;gap:10px;margin:10px 0 14px;flex-wrap:wrap}
.rng label{font-size:12px;color:var(--ink-3)}
.rng b{font-size:13px;font-family:var(--mono);min-width:44px}
.rng input[type="range"]{flex:1;max-width:220px;accent-color:var(--accent)}
.rng-lb{font-size:12px;color:var(--ink-3)}
.rng-note{font-size:11.5px;color:var(--accent)}
.count{font-size:12px;color:var(--ink-3);margin-left:auto;font-variant-numeric:tabular-nums}

.tbl-scroll{overflow-x:auto;margin:0 -18px;padding:0 18px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:860px}
th,td{text-align:right;padding:8px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
th{font-size:11.5px;color:var(--ink-3);font-weight:600;cursor:pointer;user-select:none;
  position:sticky;top:0;background:var(--surface);z-index:2}
th:hover{color:var(--ink)}
th.on{color:var(--accent)}
td.t,th.t{text-align:left;white-space:normal;min-width:300px}
td.n{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12.5px}
tbody tr:hover{background:var(--line-soft)}
.rank{width:52px;text-align:right;font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.mv{font-size:10.5px;margin-left:3px}
.mv.up{color:var(--good)} .mv.dn{color:var(--ink-3)} .mv.new{color:var(--accent);font-weight:600}
.vcell{display:flex;gap:10px;align-items:flex-start}
.thumb{width:68px;height:38px;flex:none;border-radius:5px;background:var(--line-soft);
  overflow:hidden;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.vt{line-height:1.4;font-size:12.5px}
.vt a{color:inherit;text-decoration:none}
.vt a:hover{color:var(--accent);text-decoration:underline}
.badge{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:5px;
  background:var(--pill);color:var(--ink-2);margin-left:5px;vertical-align:1px}
.badge.hot{background:var(--accent-soft);color:var(--accent);font-weight:600}
.badge.live{background:var(--good-soft);color:var(--good);font-weight:600}
.bar{position:relative}
.bar::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);
  height:16px;width:var(--w,0%);background:var(--accent-soft);border-radius:3px;z-index:0}
.bar span{position:relative;z-index:1}
.hi{color:var(--good);font-weight:600}
.lo{color:var(--ink-3)}
.dash{color:var(--ink-3)}

.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.lg{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2);
  border:1px solid var(--line);border-radius:99px;padding:3px 9px;cursor:pointer;
  background:transparent;font-family:inherit}
.lg .sw{width:9px;height:9px;border-radius:3px;flex:none}
.lg[aria-pressed="false"]{opacity:.35}
.lg .nm{max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);
  font-size:11.5px;padding:6px 9px;border-radius:7px;opacity:0;transition:opacity .12s;
  z-index:50;line-height:1.45;max-width:250px}
.tip.wide{max-width:380px;font-size:12px;padding:11px 13px;line-height:1.6}
.tip.wide b{color:var(--bg);font-weight:700}
h2 .help{margin-left:6px;width:16px;height:16px;border-radius:99px;vertical-align:1px;
  border:1px solid var(--line);background:transparent;color:var(--ink-3);
  font:inherit;font-size:10.5px;font-weight:700;line-height:1;padding:0;cursor:help}
h2 .help:hover,h2 .help[aria-expanded="true"]{background:var(--ink-3);border-color:var(--ink-3);color:var(--surface)}
/* ── 감성 막대 · 키워드 칩 ── */
.tone{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--line-soft)}
.tone i{display:block;height:100%}
.tone .p{background:var(--good)} .tone .m{background:var(--ink-3);opacity:.45} .tone .n{background:var(--accent)}
.tone-lg{display:flex;gap:14px;font-size:11.5px;color:var(--ink-2);margin-top:7px;flex-wrap:wrap}
.tone-lg b{font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:5px;vertical-align:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:12px;
  color:var(--ink-2);background:var(--bg)}
.chip b{color:var(--ink);font-variant-numeric:tabular-nums;font-size:11px;margin-left:5px;opacity:.7}
.chip.big{font-size:14px;font-weight:600;color:var(--ink);padding:4px 12px}

.vtones{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.vtone{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:12px;align-items:center}
.vtone .nm{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.vtone .n{font-size:11px;color:var(--ink-3);font-family:var(--mono);margin-left:6px}

/* ── 상세 패널 ── */
.modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal[hidden]{display:none}
.modal .backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.panel{position:relative;background:var(--surface);border:1px solid var(--line);
  border-radius:16px;width:min(760px,100%);max-height:88vh;overflow-y:auto;padding:22px}
.panel .x{position:absolute;top:12px;right:12px;border:1px solid var(--line);background:var(--bg);
  color:var(--ink-2);width:30px;height:30px;border-radius:99px;cursor:pointer;font-size:13px;line-height:1}
.m-head{display:flex;gap:14px;align-items:flex-start;margin-bottom:18px;padding-right:34px}
.m-head .thumb{width:120px;height:68px;border-radius:8px}
.m-head h3{margin:0 0 6px;font-size:16px;line-height:1.4;letter-spacing:-.01em}
.m-head a{color:var(--accent);font-size:12.5px;text-decoration:none}
.m-head a:hover{text-decoration:underline}
.m-meta{font-size:12px;color:var(--ink-3);margin-bottom:6px}
.m-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin-bottom:20px}
.m-cell{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.m-cell .k{font-size:11px;color:var(--ink-3);margin-bottom:3px}
.m-cell .v{font-size:16px;font-weight:620;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.m-sec{margin-bottom:20px}
.m-sec h4{font-size:12.5px;margin:0 0 4px;color:var(--ink);font-weight:650}
.m-sec .note{font-size:11.5px;color:var(--ink-3);margin:0 0 10px;line-height:1.5}
.cmt{border-left:2px solid var(--line);padding:2px 0 2px 11px;margin-bottom:10px;font-size:12.5px;line-height:1.5}
.cmt.pos{border-color:var(--good)} .cmt.neg{border-color:var(--accent)}
.cmt .meta{font-size:11px;color:var(--ink-3);margin-top:3px;font-variant-numeric:tabular-nums}
.pager{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.pg{border:1px solid var(--line);background:var(--bg);color:var(--ink-2);font:inherit;
  font-size:12px;padding:5px 11px;border-radius:99px;cursor:pointer}
.pg:hover:not(:disabled){color:var(--ink);border-color:var(--ink-3)}
.pg:disabled{opacity:.4;cursor:default}
.pgn{font-size:12px;font-family:var(--mono);color:var(--ink)}
.pgc{font-size:11.5px;color:var(--ink-3);margin-left:auto;font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.foot{color:var(--ink-3);font-size:12px;line-height:1.65;margin-top:26px}
.foot code{background:var(--pill);padding:1px 5px;border-radius:4px;font-size:11.5px}
@media (max-width:640px){ h1{font-size:21px} .kpi .v{font-size:19px} .card{padding:14px}
  .tbl-scroll{margin:0 -14px;padding:0 14px} .count{margin-left:0} }
</style>

<div class="wrap">
  <h1 id="ch-title">채널 지표 리더보드</h1>
  <p class="sub" id="ch-sub"></p>
  <div id="fresh"></div>
  <div id="demo-note"></div>

  <div class="kpis" id="kpis"></div>

  <section class="card">
    <div class="card-head"><h2>지금 봐야 할 것<button class="help" data-help="alerts" aria-label="읽는 법" aria-expanded="false">?</button></h2></div>
    <div class="alerts" id="alerts"></div>
  </section>

  <section class="card">
    <div class="card-head"><h2>채널 추이<button class="help" data-help="channel" aria-label="읽는 법" aria-expanded="false">?</button></h2>
      <div class="tabs" id="ch-tabs">
        <button class="tab" data-m="subscribers" aria-pressed="true">구독자</button>
        <button class="tab" data-m="daily" aria-pressed="false">일별 조회수 증가</button>
        <button class="tab" data-m="total_views" aria-pressed="false">누적 조회수</button>
      </div>
    </div>
    <div class="chart" id="ch-chart"></div>
  </section>

  <section class="card">
    <div class="card-head"><h2>업로드 후 성장 추이<button class="help" data-help="curves" aria-label="읽는 법" aria-expanded="false">?</button></h2>
      <div class="tabs" id="cv-tabs">
        <button class="tab" data-s="abs" aria-pressed="true">조회수</button>
        <button class="tab" data-s="rel" aria-pressed="false">최종 대비 %</button>
      </div>
    </div>
    <div class="chart" id="cv-chart"></div>
    <div class="legend" id="cv-legend"></div>
  </section>

  <section class="card">
    <div class="card-head"><h2>업로드 요일 · 시간대<button class="help" data-help="heatmap" aria-label="읽는 법" aria-expanded="false">?</button></h2>
      <div class="tabs" id="hm-tabs">
        <button class="tab" data-m="views" aria-pressed="true">조회수</button>
        <button class="tab" data-m="engagement" aria-pressed="false">참여율</button>
      </div>
    </div>
    <div class="tabs" id="hm-count" style="margin:8px 0 2px">
      <button class="tab" data-n="30" aria-pressed="true">최근 30개</button>
      <button class="tab" data-n="100" aria-pressed="false">100개</button>
      <button class="tab" data-n="0" aria-pressed="false">전체</button>
    </div>
    <p class="sub" id="hm-hint" style="margin:6px 0 12px"></p>
    <div class="hm-wrap"><div class="hm" id="hm"></div></div>
  </section>

  <section class="card">
    <div class="card-head"><h2>조회수 × 참여율<button class="help" data-help="scatter" aria-label="읽는 법" aria-expanded="false">?</button></h2></div>
    <div class="chart" id="sc-chart"></div>
  </section>

  <section class="card" id="cmt-card">
    <div class="card-head"><h2>댓글 동향<button class="help" data-help="comments" aria-label="읽는 법" aria-expanded="false">?</button></h2><span class="sub" id="cmt-meta"></span></div>
    <div class="rng">
      <label for="cmt-n">최근 업로드</label>
      <input type="range" id="cmt-n" min="1" max="10" value="5" step="1">
      <b id="cmt-n-label">5개</b>
    </div>
    <div id="cmt-body"></div>
  </section>

  <section class="card">
    <div class="card-head"><h2>영상 리더보드<button class="help" data-help="leaderboard" aria-label="읽는 법" aria-expanded="false">?</button></h2>
      <div class="tabs" id="f-tabs">
        <button class="tab" data-f="all" aria-pressed="true">전체</button>
        <button class="tab" data-f="long" aria-pressed="false">롱폼</button>
        <button class="tab" data-f="short" aria-pressed="false">쇼츠</button>
        <button class="tab" data-f="live" aria-pressed="false">라이브</button>
      </div>
    </div>
    <div class="tools">
      <div class="tabs" id="p-tabs">
        <button class="tab" data-p="30" aria-pressed="false">30일</button>
        <button class="tab" data-p="90" aria-pressed="false">90일</button>
        <button class="tab" data-p="180" aria-pressed="false">6개월</button>
        <button class="tab" data-p="365" aria-pressed="false">1년</button>
        <button class="tab" data-p="0" aria-pressed="true">전체</button>
      </div>
      <input type="search" id="q" placeholder="제목 검색" aria-label="제목 검색">
      <span class="count" id="count"></span>
    </div>
    <div class="tools" style="margin-top:-4px">
      <span class="rng-lb">게시일</span>
      <input type="date" id="d-from" aria-label="시작일">
      <span class="rng-lb">~</span>

/* ---------- 차트 공통 ---------- */
function frame(host, h, pad){
  const w = Math.max(host.clientWidth || 640, 320);
  const svg = el('svg', {viewBox:`0 0 ${w} ${h}`, width:w, height:h});
  host.replaceChildren(svg);
  return {svg, w, h, pad, iw: w - pad.l - pad.r, ih: h - pad.t - pad.b};
}
function ticks(min, max, n=5){
  const span = max - min || 1, raw = span / n;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1,2,2.5,5,10].map(m => m*mag).find(s => s >= raw) || mag*10;
  const out = []; for (let v = Math.ceil(min/step)*step; v <= max + 1e-9; v += step) out.push(v);
  return out;
}
function yAxis(c, min, max, label=kfmt){
  const Y = v => c.pad.t + c.ih - (v - min) / ((max - min) || 1) * c.ih;
  for (const t of ticks(min, max)){
    const y = Y(t);
    c.svg.append(el('line', {x1:c.pad.l, x2:c.w - c.pad.r, y1:y, y2:y, class:'gl', 'stroke-width':1}));
    const tx = el('text', {x:c.pad.l - 8, y:y + 3.5, class:'ax', 'text-anchor':'end'});
    tx.textContent = label(t); c.svg.append(tx);
  }
  return Y;
}
function path(pts, color, width=2, dash){
  const a = {d: pts.map((p,i) => (i?'L':'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' '),
    fill:'none', stroke:color, 'stroke-width':width, 'stroke-linejoin':'round', 'stroke-linecap':'round'};
  if (dash) a['stroke-dasharray'] = dash;
  return el('path', a);
}

let chMetric = 'subscribers';
function drawChannel(){
  const host = document.getElementById('ch-chart'), rows = DATA.channel;
  if (!rows || rows.length < 2){
    host.innerHTML = '<p class="hint">스냅샷이 2개 이상 쌓이면 추이가 그려집니다. (하루만 돌려보세요)</p>'; return;
  }
  let series = rows.map(r => ({t:new Date(r.ts), v:r[chMetric === 'daily' ? 'total_views' : chMetric]}));
  if (chMetric === 'daily'){
    const out = [];
    for (let i = 1; i < series.length; i++){
      const days = Math.max((series[i].t - series[i-1].t) / 864e5, 1/24);
      out.push({t:series[i].t, v:(series[i].v - series[i-1].v) / days});
    }
    series = out;
  }
  const c = frame(host, 240, {l:58, r:14, t:12, b:26});
  const vs = series.map(s => s.v);
  let min = Math.min(...vs), max = Math.max(...vs);
  if (chMetric !== 'daily'){ const p = (max - min) * .15 || max * .02 || 1; min -= p; max += p; }
  else min = Math.min(0, min);
  const Y = yAxis(c, min, max);
  const t0 = series[0].t, t1 = series[series.length-1].t;
  const X = t => c.pad.l + (t - t0) / ((t1 - t0) || 1) * c.iw;
  const pts = series.map(s => [X(s.t), Y(s.v)]);
  const col = cssv('--c2');
  c.svg.append(el('path', {d:`M${pts[0][0]} ${c.pad.t+c.ih} ` + pts.map(p=>`L${p[0]} ${p[1]}`).join(' ') +
    ` L${pts[pts.length-1][0]} ${c.pad.t+c.ih} Z`, fill:col, opacity:.08}), path(pts, col, 2));
  series.forEach((s, i) => {
    const h = el('circle', {cx:pts[i][0], cy:pts[i][1], r:9, fill:'transparent', class:'dot-hit'});
    h.addEventListener('mousemove', e => showTip(e,
      `<b>${dfmt(s.t)}</b><br>${chMetric === 'daily' ? '일 평균 증가 ' : ''}${fmt(s.v)}`));
    h.addEventListener('mouseleave', hideTip);
    c.svg.append(h);
  });
  [0, series.length-1].forEach(i => {
    const tx = el('text', {x:pts[i][0], y:c.h - 8, class:'ax', 'text-anchor': i ? 'end' : 'start'});
    tx.textContent = dfmt(series[i].t); c.svg.append(tx);
  });
}

/* ---------- 업로드 후 성장 곡선 ---------- */
let cvScale = 'abs', cvOn = new Set();
const curveVideos = () => DATA.videos.filter(v => v.curve && v.curve.length > 1)
  .sort((a,b) => new Date(b.published_at) - new Date(a.published_at)).slice(0, 6);
function drawCurves(){
  const host = document.getElementById('cv-chart'), vids = curveVideos();
  if (!vids.length){
    host.innerHTML = '<p class="hint">공개 후 7일 이내 영상의 스냅샷이 2개 이상 쌓이면 곡선이 그려집니다.</p>';
    document.getElementById('cv-legend').innerHTML = ''; return;
  }
  const c = frame(host, 280, {l:58, r:14, t:12, b:30});
  const shown = vids.filter(v => cvOn.has(v.id));
  const val = (v, y) => cvScale === 'rel' ? y / v.curve[v.curve.length-1][1] * 100 : y;
  const useBase = cvScale === 'abs' && DATA.baseline.length;
  const maxY = Math.max(1, ...shown.flatMap(v => v.curve.map(p => val(v, p[1]))),
                        ...(useBase ? DATA.baseline.map(p => p[1]) : []));
  const Y = yAxis(c, 0, maxY, cvScale === 'rel' ? (t => t.toFixed(0) + '%') : kfmt);
  const X = h => c.pad.l + Math.min(h, 168) / 168 * c.iw;
  [0,24,48,72,96,120,144,168].forEach(h => {
    c.svg.append(el('line', {x1:X(h), x2:X(h), y1:c.pad.t, y2:c.pad.t + c.ih, class:'gl','stroke-width':1}));
    const tx = el('text', {x:X(h), y:c.h - 10, class:'ax', 'text-anchor':'middle'});
    tx.textContent = h === 0 ? '공개' : (h/24) + '일'; c.svg.append(tx);
  });
  if (useBase){
    c.svg.append(path(DATA.baseline.map(p => [X(p[0]), Y(p[1])]), cssv('--ink-3'), 1.5, '4 4'));
    const lb = el('text', {x:X(168) - 4, y:Y(DATA.baseline[DATA.baseline.length-1][1]) - 7,
      class:'ax', 'text-anchor':'end'});
    lb.textContent = '채널 평균'; c.svg.append(lb);
  }
  vids.forEach((v, i) => {
    if (!cvOn.has(v.id)) return;
    const col = cssv(PAL[i % PAL.length]);
    const pts = v.curve.map(p => [X(p[0]), Y(val(v, p[1]))]);
    c.svg.append(path(pts, col, 2));
    v.curve.forEach((p, j) => {
      const hit = el('circle', {cx:pts[j][0], cy:pts[j][1], r:7, fill:'transparent', class:'dot-hit'});
      hit.addEventListener('mousemove', e => showTip(e,
        `<b>${esc(v.title)}</b><br>공개 후 ${p[0].toFixed(0)}시간 · ${fmt(p[1])}회`));
      hit.addEventListener('mouseleave', hideTip);
      c.svg.append(hit);
    });
  });
  document.getElementById('cv-legend').replaceChildren(...vids.map((v, i) => {
    const b = document.createElement('button');
    b.className = 'lg'; b.setAttribute('aria-pressed', cvOn.has(v.id));
    b.innerHTML = `<i class="sw" style="background:${cssv(PAL[i%PAL.length])}"></i><span class="nm">${esc(v.title)}</span>`;
    b.onclick = () => { cvOn.has(v.id) ? cvOn.delete(v.id) : cvOn.add(v.id); drawCurves(); };
    return b;
  }));
}

let hmMetric = 'views', hmCount = 30;
const DOW = ['일','월','화','수','목','금','토'];
function drawHeatmap(){
  const host = document.getElementById('hm');
  // 최근 게재순으로 자른다 — 1년 전 업로드 습관은 지금 판단에 도움이 안 되니까
  const pool = [...DATA.videos].sort((a, b) => new Date(b.published_at) - new Date(a.published_at));
  const used = hmCount ? pool.slice(0, hmCount) : pool;
  const cells = {}; // key: `${dow}-${slot}`
  for (const v of used){
    const d = new Date(v.published_at);          // 보는 사람의 로컬 시간대(=KST) 기준
    const key = d.getDay() + '-' + Math.floor(d.getHours() / 3);
    (cells[key] = cells[key] || []).push(v);
  }
  const value = list => hmMetric === 'views'
    ? list.reduce((s,v) => s + v.views, 0) / list.length
    : list.reduce((s,v) => s + v.engagement, 0) / list.length;
  const vals = Object.values(cells).map(value);
  const max = Math.max(...vals, 1), min = Math.min(...vals, 0);

  const out = ['<div class="hd"></div>'];
  for (let s = 0; s < 8; s++) out.push(`<div class="hd">${s*3}시</div>`);
  for (let d = 0; d < 7; d++){
    out.push(`<div class="rw">${DOW[d]}</div>`);
    for (let s = 0; s < 8; s++){
      const list = cells[d + '-' + s];
      if (!list){ out.push('<div class="cl"></div>'); continue; }
      const v = value(list);
      const a = 0.16 + 0.74 * ((v - min) / ((max - min) || 1));
      const label = hmMetric === 'views' ? kfmt(v) : v.toFixed(1) + '%';
      const names = list.map(x => '· ' + esc(x.title)).join('<br>');
      out.push(`<div class="cl on" style="background:rgba(var(--heat),${a.toFixed(2)})"
        data-tip="${esc(label)} · 영상 ${list.length}개<br>${names}">${label}</div>`);
    }
  }
  host.innerHTML = out.join('');
  host.querySelectorAll('[data-tip]').forEach(c => {
    c.addEventListener('mousemove', e => showTip(e, c.dataset.tip));
    c.addEventListener('mouseleave', hideTip);
  });
  const span = used.length
    ? `${dfmt(used[used.length - 1].published_at)} ~ ${dfmt(used[0].published_at)}` : '';
  document.getElementById('hm-hint').textContent =
    `최근 게재 ${used.length}개 · ${span} · ${hmMetric === 'views' ? '평균 조회수' : '평균 참여율'}`;
}

/* ---------- 리더보드 ---------- */
let sortK = 'views', sortDir = -1, filt = 'all', period = 0, query = '';
let dFrom = '', dTo = '';   // 직접 지정한 게시일 범위 (YYYY-MM-DD). 있으면 프리셋보다 우선
const dayOf = s => new Date(s).toLocaleDateString('sv-SE');   // 로컬 시간 기준 YYYY-MM-DD
function rows(){
  const q = query.trim().toLowerCase();
  const custom = dFrom || dTo;
  let r = DATA.videos.filter(v => {
    if (filt !== 'all' && v.kind !== filt) return false;
    if (q && !v.title.toLowerCase().includes(q)) return false;
    if (custom){
      const d = dayOf(v.published_at);
      if (dFrom && d < dFrom) return false;
      if (dTo && d > dTo) return false;
      return true;
    }
    return !period || v.age_days <= period;
  });
  const get = v => ['h24','h72','h168'].includes(sortK) ? v.milestones[sortK]
    : (['ctr','avg_percent','impressions'].includes(sortK) ? st(v, sortK) : v[sortK]);
  return r.sort((a, b) => {
    const x = get(a), y = get(b);
    if (x == null) return 1;
    if (y == null) return -1;
    if (sortK === 'title') return String(x).localeCompare(String(y), 'ko') * sortDir;
    if (sortK === 'published_at') return (new Date(x) - new Date(y)) * sortDir;
    return (x - y) * sortDir;
  });
}
const KIND_LABEL = {short:'쇼츠', live:'라이브', long:'롱폼'};
const kindBadge = v => v.kind === 'long' ? ''
  : `<span class="badge${v.kind === 'live' ? ' live' : ''}">${KIND_LABEL[v.kind]}</span>`;

/* Studio 내보내기에서 온 값. 없는 영상은 '–'로 둡니다 (추측해 채우지 않습니다) */
const st = (v, k) => (v.studio && v.studio[k] != null) ? v.studio[k] : null;
const ctrCell = v => {
  const c = st(v, 'ctr');
  if (c == null) return '<span class="dash">–</span>';
  const med = DATA.studio_summary ? DATA.studio_summary.median_ctr : 0;
  return `<span class="${c >= med ? 'hi' : 'lo'}">${c.toFixed(2)}%</span>`;
};
const pctCell = v => {
  const p = st(v, 'avg_percent');
  if (p == null) return '<span class="dash">–</span>';
  // 100%를 넘는 건 반복 재생(주로 쇼츠) 때문입니다. 오류가 아니라 표시만 구분합니다.
  return p > 100 ? `<span class="hi" title="반복 재생 포함">${p.toFixed(0)}%↻</span>`
                 : `${p.toFixed(1)}%`;
};

const NEW_DAYS = 10;              // 며칠 이내 영상에 NEW를 붙일지
const isNew = v => v.age_days <= NEW_DAYS;

/* 순위 옆 표시.
   NEW는 '게재된 지 얼마 안 됨'을 뜻하고, 화살표는 '7일 전 대비 순위 변동'입니다.
   화살표는 조회수 내림차순일 때만 보여줍니다 — 참여율 등 다른 기준으로 정렬해두면
   번호와 화살표가 서로 다른 잣대가 돼서 읽는 사람을 헷갈리게 하기 때문입니다. */
function rankMark(v, idx, prevIdx, showMove){
  if (isNew(v)) return '<span class="mv new">NEW</span>';
  if (!showMove) return '';
  const p = prevIdx.get(v.id);
  if (p == null) return '';
  const d = p - idx;
  if (d === 0) return '<span class="mv dn">–</span>';
  return d > 0 ? `<span class="mv up">▲${d}</span>` : `<span class="mv dn">▼${-d}</span>`;
}
function drawTable(){
  const rs = rows(), maxV = Math.max(1, ...rs.map(v => v.views));

  // 순위 변동은 '지금 화면에 있는 영상들끼리' 비교합니다.

      <td class="rank">${i + 1}${rankMark(v, i + 1, prevIdx, showMove)}</td>

      <td class="n">${dfmt(v.published_at)}</td>

}

/* ---------- 댓글 동향 ---------- */
function toneBar(a){
  const n = Math.max(a.pos + a.neu + a.neg, 1), p = x => (x / n * 100).toFixed(1) + '%';
  return `<div class="tone"><i class="p" style="width:${p(a.pos)}"></i>` +
    `<i class="m" style="width:${p(a.neu)}"></i><i class="n" style="width:${p(a.neg)}"></i></div>`;
}
function toneLegend(a){
  return `<div class="tone-lg">
    <span><i class="dot" style="background:var(--good)"></i>긍정 <b>${a.pos}</b></span>
    <span><i class="dot" style="background:var(--ink-3);opacity:.45"></i>중립 <b>${a.neu}</b></span>
    <span><i class="dot" style="background:var(--accent)"></i>부정 <b>${a.neg}</b></span></div>`;
}
let cmtN = 5;   // 최근 업로드 몇 개를 볼지 (1~10)
function drawComments(){
  const host = document.getElementById('cmt-body'), cs = DATA.comment_summary;
  const rng = document.getElementById('cmt-n').parentElement;
  if (!cs){
    document.getElementById('cmt-meta').textContent = '';
    rng.hidden = true;
    host.innerHTML = `<div class="empty">아직 댓글을 수집하지 않았습니다.
      <code>python collect_comments.py</code> 를 한 번 실행하면 (또는 run.bat이 하루 한 번 자동으로 돌면)
      여기에 키워드와 반응 온도가 채워집니다.</div>`;
    return;
  }
  rng.hidden = false;

  // 댓글이 있는 영상을 '최근 게재순'으로 놓고 앞에서 N개만 봅니다
  const pool = DATA.videos.filter(v => v.comments_analysis)
    .sort((a, b) => new Date(b.published_at) - new Date(a.published_at));
  const slider = document.getElementById('cmt-n');
  slider.max = Math.min(10, pool.length);
  cmtN = Math.min(cmtN, +slider.max);
  slider.value = cmtN;
  document.getElementById('cmt-n-label').textContent = `${cmtN}개`;
  const used = pool.slice(0, cmtN);

  // 고른 영상들만으로 다시 집계합니다 (감성은 정확한 합, 키워드는 등장 댓글 수 합산)
  const sum = {pos:0, neu:0, neg:0}, total = used.reduce((s,v) => s + v.comments_analysis.n, 0);
  const kw = new Map();
  for (const v of used){
    const a = v.comments_analysis;
    sum.pos += a.pos; sum.neu += a.neu; sum.neg += a.neg;
    for (const [w, n] of a.keywords) kw.set(w, (kw.get(w) || 0) + n);
  }
  const keywords = [...kw.entries()].sort((a,b) => b[1] - a[1]).slice(0, 24);
  const maxKw = Math.max(...keywords.map(k => k[1]), 1);

  const span = used.length
    ? `${dfmt(used[used.length-1].published_at)} ~ ${dfmt(used[0].published_at)}` : '';
  document.getElementById('cmt-meta').textContent =
    `영상 ${used.length}개 · 댓글 ${fmt(total)}개 · ${span} 게재분 · ${dfmt(cs.fetched_at)} 수집`;

  host.innerHTML = `
    <div class="m-sec"><h4>전체 반응</h4>
      ${toneBar(sum)}${toneLegend(sum)}</div>
    <div class="m-sec"><h4>자주 나오는 키워드</h4>
      <p class="note">숫자는 그 단어가 등장한 댓글 수입니다. 두 개 이상의 댓글에 나온 단어만 셌습니다.</p>
      <div class="chips">${keywords.map(([w,n]) =>
        `<span class="chip${n >= maxKw * 0.6 ? ' big' : ''}">${esc(w)}<b>${n}</b></span>`).join('')}</div></div>
    <div class="m-sec" style="margin-bottom:0"><h4>영상별 반응</h4>
      <p class="note">막대를 보면 어떤 영상이 유독 부정 반응을 받았는지 바로 보입니다. 클릭하면 실제 댓글이 열립니다.</p>
      <div class="vtones">${used.map(v => `
        <div class="vtone" data-open="${v.id}" style="cursor:pointer">
          <div class="nm">${esc(v.title)}<span class="n">${v.comments_analysis.n}</span></div>
          ${toneBar(v.comments_analysis)}
        </div>`).join('')}</div></div>`;
}

/* 댓글 목록 페이지 넘기기 (한 번에 10개) */
const PER_PAGE = 10;
let clState = null;
const cmtHtml = c => `<div class="cmt ${c.o}">${esc(c.t)}
  <div class="meta">좋아요 ${fmt(c.l)}</div></div>`;
function renderCmtPage(){
  if (!clState) return;
  const all = clState.list.filter(c => c.o === clState.tone);
  const pages = Math.max(Math.ceil(all.length / PER_PAGE), 1);
  clState.page = Math.min(Math.max(clState.page, 0), pages - 1);
  const start = clState.page * PER_PAGE;

  document.getElementById('cl-list').innerHTML = all.length
    ? all.slice(start, start + PER_PAGE).map(cmtHtml).join('')
    : `<p class="note">해당하는 댓글이 없습니다.</p>`;

  document.getElementById('cl-pager').innerHTML = pages > 1 ? `
    <button class="pg" data-pg="-1" ${clState.page === 0 ? 'disabled' : ''}>← 이전</button>
    <span class="pgn">${clState.page + 1} / ${pages}</span>
    <button class="pg" data-pg="1" ${clState.page === pages - 1 ? 'disabled' : ''}>다음 →</button>
    <span class="pgc">${all.length}개 중 ${start + 1}–${Math.min(start + PER_PAGE, all.length)}</span>` : '';

  document.querySelectorAll('#cl-pager .pg').forEach(b => b.onclick = () => {
    clState.page += +b.dataset.pg;
    renderCmtPage();
    document.getElementById('cl-list').scrollIntoView({block:'nearest'});
  });
}
function drawMiniCurve(v){
  const host = document.getElementById('m-chart');
  if (!host) return;
  const c = frame(host, 190, {l:52, r:12, t:10, b:26});
  const maxY = Math.max(...v.curve.map(p => p[1]),
                        ...(DATA.baseline.length ? DATA.baseline.map(p => p[1]) : [0]), 1);
  const Y = yAxis(c, 0, maxY);
  const X = h => c.pad.l + Math.min(h, 168) / 168 * c.iw;
  [0,24,72,120,168].forEach(h => {
    c.svg.append(el('line', {x1:X(h), x2:X(h), y1:c.pad.t, y2:c.pad.t+c.ih, class:'gl','stroke-width':1}));
    const tx = el('text', {x:X(h), y:c.h - 8, class:'ax','text-anchor':'middle'});
    tx.textContent = h === 0 ? '공개' : (h/24) + '일'; c.svg.append(tx);
  });
  if (DATA.baseline.length)
    c.svg.append(path(DATA.baseline.map(p => [X(p[0]), Y(p[1])]), cssv('--ink-3'), 1.5, '4 4'));
  c.svg.append(path(v.curve.map(p => [X(p[0]), Y(p[1])]), cssv('--c1'), 2));
}

/* ---------- 데이터 신선도 ---------- */
const STALE_HOURS = 3;   // 몇 시간 넘게 수집이 없으면 경고할지 (수집 주기는 1시간)
function drawFreshness(){
  const host = document.getElementById('fresh');
  const gen = new Date(DATA.generated_at);
  const hours = (Date.now() - gen) / 36e5;
  const stale = hours >= STALE_HOURS;

  // '몇 시간 전'을 사람이 읽는 말로
  const ago = hours < 1 ? `${Math.round(hours * 60)}분 전`
    : hours < 24 ? `${Math.floor(hours)}시간 전`
    : `${Math.floor(hours / 24)}일 ${Math.floor(hours % 24)}시간 전`;

  const why = stale
    ? `수집이 멈춰 있을 수 있습니다 — 아래 숫자는 ${ago} 기준입니다`
    : '자동 수집이 정상 동작 중입니다';

  host.innerHTML = `<div class="fresh${stale ? ' warn' : ''}">
    <i class="dot"></i>
    <span>마지막 수집 <b>${ago}</b></span>
    <span class="why">· ${esc(why)}</span>
    <button class="reload" onclick="location.reload()">새로고침</button>
  </div>`;
}

/* ---------- KPI ---------- */
function drawKpis(){
  const ch = DATA.channel, last = ch[ch.length-1], first = ch[0], vs = DATA.videos;
  const dSub = last && first ? last.subscribers - first.subscribers : null;
  const recent = vs.filter(v => v.age_days <= 30);
  const avg = recent.length ? recent.reduce((s,v) => s+v.views, 0) / recent.length : null;
  const best = vs[0];
  const cards = [
    ['구독자', last ? fmt(last.subscribers) : '–',
      dSub == null ? '' : `<span class="${dSub > 0 ? 'up' : ''}">${dSub >= 0 ? '+' : ''}${fmt(dSub)} · 최근 ${DATA.span_days}일</span>`],
    ['누적 조회수', last ? kfmt(last.total_views) : '–', last ? fmt(last.total_views) + '회' : ''],
    ['추적 중인 영상', fmt(vs.length) + '개', `스냅샷 ${fmt(ch.length)}회`],
    ['최근 30일 평균 조회수', kfmt(avg), recent.length ? `영상 ${recent.length}개 기준` : '해당 영상 없음'],
    ['중앙 참여율', DATA.median_engagement.toFixed(2) + '%', '(좋아요+댓글)/조회수'],
    ['최고 조회수 영상', best ? kfmt(best.views) : '–', best ? esc(best.title.slice(0, 22)) : ''],
  ];
  document.getElementById('kpis').innerHTML = cards.map(([k,v,d]) =>
    `<div class="kpi"><div class="k">${k}</div><div class="v">${v}</div><div class="d">${d}</div></div>`).join('');
}

/* ---------- 초기화 ---------- */
function pressGroup(group, btn){ [...group.children].forEach(x => x.setAttribute('aria-pressed', x === btn)); }
function init(){
  document.getElementById('ch-title').textContent = DATA.channel_title;
  document.getElementById('ch-sub').textContent =
    `마지막 갱신 ${new Date(DATA.generated_at).toLocaleString('ko-KR')} · ${DATA.span_days}일간 스냅샷 ${DATA.channel.length}회`;
  if (DATA.demo) document.getElementById('demo-note').innerHTML =
    '<div class="demo">샘플 데이터입니다 — collect.py로 실제 채널을 수집한 뒤 다시 생성하면 이 화면에 내 채널 숫자가 들어갑니다.</div>';
  curveVideos().slice(0, 4).forEach(v => cvOn.add(v.id));
  drawFreshness(); drawKpis(); drawAlerts(); drawChannel(); drawCurves(); drawHeatmap();
  drawScatter(); drawComments(); drawTable();
  // 페이지를 켜둔 채로 시간이 흐르면 '몇 시간 전'이 틀려지므로 1분마다 다시 계산합니다
  setInterval(drawFreshness, 60000);

  // 제목 옆 ? 에 마우스를 올리면 읽는 법이 뜹니다. 터치 기기를 위해 클릭으로도 열립니다.
  document.querySelectorAll('.help').forEach(b => {
    const show = e => { showTip(e, HELP[b.dataset.help], true); b.setAttribute('aria-expanded', 'true'); };
    const hide = () => { hideTip(); b.setAttribute('aria-expanded', 'false'); };
    b.addEventListener('mouseenter', show);
    b.addEventListener('mousemove', e => { if (tip.style.opacity === '1') show(e); });
    b.addEventListener('mouseleave', hide);
    b.addEventListener('focus', () => {
      const r = b.getBoundingClientRect();
      showTip({clientX: r.left, clientY: r.bottom}, HELP[b.dataset.help], true);
    });
    b.addEventListener('blur', hide);
    b.addEventListener('click', e => {
      e.stopPropagation();
      if (b.getAttribute('aria-expanded') === 'true') hide(); else show(e);
    });
  });

  // 표의 행이나 댓글 막대를 누르면 상세 패널이 열립니다 (제목 링크는 유튜브로)
  document.addEventListener('click', e => {
    if (e.target.closest('[data-close]')) { closeModal(); return; }
    if (e.target.closest('a')) return;
    const row = e.target.closest('[data-open]');
    if (row && !e.target.closest('.panel')) openDetail(row.dataset.open);
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !modal.hidden) closeModal();
    if (e.key === 'Enter'){
      const row = e.target.closest && e.target.closest('tr[data-open]');
      if (row) openDetail(row.dataset.open);
    }
  });

  document.getElementById('foot').innerHTML =
    'YouTube Data API v3 기준. 좋아요 수는 비공개 설정 시 0으로 보입니다. 싫어요 수는 2021년부터 API에서 제공되지 않습니다. ' +
    '노출 클릭률(CTR)·시청 지속시간·트래픽 소스는 이 API로는 볼 수 없고 YouTube Analytics API(OAuth 인증)가 필요합니다. ' +
    '갱신하려면 <code>run.bat</code>을 실행하세요.';

  document.getElementById('ch-tabs').onclick = e => { const b = e.target.closest('.tab'); if (!b) return;
    chMetric = b.dataset.m; pressGroup(e.currentTarget, b); drawChannel(); };
  document.getElementById('cv-tabs').onclick = e => { const b = e.target.closest('.tab'); if (!b) return;
    cvScale = b.dataset.s; pressGroup(e.currentTarget, b); drawCurves(); };
  document.getElementById('hm-tabs').onclick = e => { const b = e.target.closest('.tab'); if (!b) return;
    hmMetric = b.dataset.m; pressGroup(e.currentTarget, b); drawHeatmap(); };
  document.getElementById('hm-count').onclick = e => { const b = e.target.closest('.tab'); if (!b) return;
    hmCount = +b.dataset.n; pressGroup(e.currentTarget, b); drawHeatmap(); };
  document.getElementById('f-tabs').onclick = e => { const b = e.target.closest('.tab'); if (!b) return;
    filt = b.dataset.f; pressGroup(e.currentTarget, b); drawTable(); };
  document.getElementById('p-tabs').onclick = e => { const b = e.target.closest('.tab'); if (!b) return;
    period = +b.dataset.p;
    dFrom = dTo = '';                                   // 프리셋을 누르면 직접 지정은 해제
    document.getElementById('d-from').value = '';
    document.getElementById('d-to').value = '';
    pressGroup(e.currentTarget, b); drawTable(); };
  document.getElementById('q').addEventListener('input', e => { query = e.target.value; drawTable(); });
  document.getElementById('cmt-n').addEventListener('input', e => {
    cmtN = +e.target.value; drawComments();
  });

  // 게시일 직접 지정 — 한쪽만 채워도 됩니다 (그 날짜 이후 / 이전)
  const from = document.getElementById('d-from'), to = document.getElementById('d-to');
  const pubs = DATA.videos.map(v => dayOf(v.published_at)).sort();
  if (pubs.length){ from.min = to.min = pubs[0]; from.max = to.max = pubs[pubs.length - 1]; }
  const onRange = () => { dFrom = from.value; dTo = to.value; drawTable(); };
  from.addEventListener('change', onRange);
  to.addEventListener('change', onRange);
  document.getElementById('d-clear').onclick = () => {
    from.value = to.value = ''; dFrom = dTo = '';
    const all = document.querySelector('#p-tabs .tab[data-p="0"]');
    period = 0; pressGroup(document.getElementById('p-tabs'), all); drawTable();
  };
  document.querySelectorAll('#lb th[data-k]').forEach(th => th.onclick = () => {
    const k = th.dataset.k;
    if (k === sortK) sortDir *= -1;
    else { sortK = k; sortDir = (k === 'title' || k === 'rank') ? 1 : -1; }
    drawTable();
  });
  let rt; addEventListener('resize', () => { clearTimeout(rt);
    rt = setTimeout(() => { drawChannel(); drawCurves(); drawScatter(); }, 160); });
}
init();
</script>
